name: Build and Deploy BFF

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: bff-auth

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ steps.vars.outputs.image_tag }} .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Save image as artifact
        run: docker save $IMAGE_NAME:${{ steps.vars.outputs.image_tag }} -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'non-production' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Tag and push image
        run: |
          docker tag $IMAGE_NAME:${{ needs.build.outputs.image_tag }} ${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }}

      - name: Health check
        run: |
          curl --fail --retry 5 --retry-delay 5 "${{ secrets.CONTAINER_APP_URL }}/health"
