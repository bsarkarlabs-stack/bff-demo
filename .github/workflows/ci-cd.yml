name: Build and Deploy BFF

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  id-token: write
  contents: read

concurrency:
  group: bff-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: bff-auth

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      # No Python setup/install here: nothing in this job runs Python (no
      # lint or test step yet) and the Docker build reinstalls dependencies
      # independently anyway. Add it back alongside a real test step once
      # app/ has one (see issue #4) -- an unused install step is dead weight.

      - name: Compute image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ steps.vars.outputs.image_tag }} .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Save image as artifact
        run: docker save $IMAGE_NAME:${{ steps.vars.outputs.image_tag }} -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'non-production' }}
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
      CONTAINER_APP_URL: ${{ vars.CONTAINER_APP_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Tag and push image
        run: |
          docker tag $IMAGE_NAME:${{ needs.build.outputs.image_tag }} $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }}
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }}

      - name: Record currently running image (rollback target)
        id: previous
        run: |
          PREV_IMAGE=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "image=$PREV_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Previous image: $PREV_IMAGE"

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }}

      - name: Identify new revision
        id: wait_revision
        run: |
          REVISION=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.latestRevisionName -o tsv)
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "New revision: $REVISION"

      # Runs before the revision-state check on purpose: this app scales to
      # zero (minReplicas=0), and a new revision has no replica -- and so
      # never reports runningState=Running -- until something actually
      # sends it traffic. Health check first triggers that cold start;
      # checking revision state before any request would just deadlock.
      - name: Health check
        run: |
          curl --fail --retry 8 --retry-delay 8 "$CONTAINER_APP_URL/health"

      - name: Confirm revision is Running
        run: |
          REVISION="${{ steps.wait_revision.outputs.revision }}"
          STATE=$(az containerapp revision show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --revision "$REVISION" --query properties.runningState -o tsv)
          echo "Revision $REVISION state: $STATE"
          if [ "$STATE" != "Running" ] && [ "$STATE" != "RunningAtMaxScale" ]; then
            echo "Revision is not in a healthy running state"
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && steps.previous.outcome == 'success'
        run: |
          echo "Deployment failed -- rolling back to previous image: ${{ steps.previous.outputs.image }}"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.previous.outputs.image }}"
          echo "Rollback complete. This run is still marked failed so the bad image is investigated -- production is safe."

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deployment summary"
            echo "- Target image: \`$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }}\`"
            echo "- Previous image: \`${{ steps.previous.outputs.image }}\`"
            echo "- Revision: \`${{ steps.wait_revision.outputs.revision }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
